[package]
name = "svarog"
version = "0.5.3"
edition = "2021"
license = "MIT"
description = "A CLI sidecar that turns AI-agent waiting time into tiny, adaptive workouts."
repository = "https://github.com/zotttttttt/svarog"
readme = "README.md"
keywords = ["cli", "tui", "exercise", "productivity", "codex"]
categories = ["command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "THIRD_PARTY_NOTICES.html",
    "about.hbs",
    "about.toml",
    "svarog.png",
    "build.rs",
    "data/**",
    "prompts/**",
    "scripts/**",
    "src/**",
    "tests/**",
]

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "5"
libc = "0.2"
minijinja = { version = "2", features = ["json"] }
keyring = "4"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
unicode-width = "0.2"
zeroize = "1"

[dev-dependencies]
chrono-tz = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
