name: Dependabot auto-merge

on:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # App token, not GITHUB_TOKEN: merges made with GITHUB_TOKEN don't trigger
      # push workflows on main (CI, audit, release-please).
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Required checks gate the merge; breaking bumps that fail CI wait for a human.
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  update-branches:
    name: Update behind bot PRs
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # The ruleset requires up-to-date branches and Dependabot only rebases on
      # conflicts, so auto-merge PRs that fall behind main would wait forever.
      - name: Rebase behind PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --state open --json number,autoMergeRequest,headRefName \
              --jq '.[] | select(.autoMergeRequest != null and (.headRefName | test("^(dependabot|bot)/"))) | .number'); do
            state=$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$state" = "BEHIND" ]; then
              gh pr update-branch "$pr" --rebase || echo "::warning::could not update #$pr"
            fi
          done
