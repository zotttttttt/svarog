name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify published release and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: ${RELEASE_TAG}" >&2
              exit 1
              ;;
          esac

          published_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'if .draft == false and .published_at != null then .tag_name else empty end')"
          test "$published_tag" = "$RELEASE_TAG"

          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_TAG" = "v${package_version}"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify and package binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="${RELEASE_TAG#v}"
          binary="target/${TARGET}/release/svarog"
          actual_version="$($binary --version)"
          test "$actual_version" = "svarog $version"

          binary_size="$(wc -c < "$binary" | tr -d '[:space:]')"
          case "$binary_size" in
            ''|*[!0-9]*)
              echo "Invalid binary size for ${TARGET}: ${binary_size}" >&2
              exit 1
              ;;
          esac
          test "$binary_size" -gt 0

          package="svarog-${version}-${TARGET}"
          mkdir -p "dist/$package"
          cp "$binary" README.md LICENSE THIRD_PARTY_NOTICES.html svarog.png "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          printf '%s\n' "$binary_size" > "dist/${TARGET}.size"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.size
          if-no-files-found: error

  publish:
    name: Upload release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - name: Generate and verify installer
        run: |
          version="${RELEASE_TAG#v}"
          checksum_for() {
            awk -v archive="$1" '$2 == archive || $2 == "*" archive { print $1; exit }' dist/SHA256SUMS
          }
          arm_macos_checksum="$(checksum_for "svarog-${version}-aarch64-apple-darwin.tar.gz")"
          intel_macos_checksum="$(checksum_for "svarog-${version}-x86_64-apple-darwin.tar.gz")"
          linux_checksum="$(checksum_for "svarog-${version}-x86_64-unknown-linux-gnu.tar.gz")"
          test "${#arm_macos_checksum}" -eq 64
          test "${#intel_macos_checksum}" -eq 64
          test "${#linux_checksum}" -eq 64

          sed \
            -e "s/@SVAROG_VERSION@/${version}/g" \
            -e "s/@SVAROG_SHA256_AARCH64_APPLE_DARWIN@/${arm_macos_checksum}/g" \
            -e "s/@SVAROG_SHA256_X86_64_APPLE_DARWIN@/${intel_macos_checksum}/g" \
            -e "s/@SVAROG_SHA256_X86_64_UNKNOWN_LINUX_GNU@/${linux_checksum}/g" \
            scripts/install > dist/svarog-installer.sh
          chmod 755 dist/svarog-installer.sh
          bash -n dist/svarog-installer.sh
          ! grep -F '@SVAROG_' dist/svarog-installer.sh

          expected_targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            x86_64-unknown-linux-gnu
          )
          for target in "${expected_targets[@]}"; do
            archive="svarog-${version}-${target}.tar.gz"
            test -s "dist/${archive}"
            grep -F "  ${archive}" dist/SHA256SUMS >/dev/null
          done

      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/svarog-installer.sh

      - name: Verify release attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/svarog-installer.sh --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
          for archive in dist/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done

      - name: Create binary size badge metadata
        working-directory: dist
        run: |
          expected_targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            x86_64-unknown-linux-gnu
          )
          sizes=()

          actual_size_file_count="$(find . -maxdepth 1 -type f -name '*.size' | wc -l | tr -d '[:space:]')"
          test "$actual_size_file_count" -eq "${#expected_targets[@]}"

          for target in "${expected_targets[@]}"; do
            size_file="${target}.size"
            test -f "$size_file"
            size="$(tr -d '[:space:]' < "$size_file")"
            case "$size" in
              ''|*[!0-9]*)
                echo "Invalid binary size for ${target}: ${size}" >&2
                exit 1
                ;;
            esac
            test "$size" -gt 0
            sizes+=("$size")
          done

          min_size="$(printf '%s\n' "${sizes[@]}" | sort -n | head -n 1)"
          max_size="$(printf '%s\n' "${sizes[@]}" | sort -n | tail -n 1)"
          min_mb="$(LC_ALL=C awk -v bytes="$min_size" 'BEGIN { printf "%.1f", bytes / 1000000 }')"
          max_mb="$(LC_ALL=C awk -v bytes="$max_size" 'BEGIN { printf "%.1f", bytes / 1000000 }')"

          if test "$min_mb" = "$max_mb"; then
            message="${min_mb} MB"
          else
            message="${min_mb}–${max_mb} MB"
          fi

          jq -n \
            --arg message "$message" \
            '{
              schemaVersion: 1,
              label: "binary",
              message: $message,
              color: "888888",
              labelColor: "070808"
            }' > binary-size.json

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS
          dist/binary-size.json dist/svarog-installer.sh
          --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update latest binary size badge
        if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
        env:
          BADGE_BRANCH: badges
          GH_TOKEN: ${{ github.token }}
        run: |
          badge_path="binary-size.json"
          badge_api="repos/${GITHUB_REPOSITORY}/contents/${badge_path}"
          badge_sha="$(gh api "${badge_api}?ref=${BADGE_BRANCH}" --jq '.sha')"
          current_content="$(gh api "${badge_api}?ref=${BADGE_BRANCH}" --jq '.content' | tr -d '\n' | base64 --decode)"
          new_content="$(cat dist/binary-size.json)"

          if test "$current_content" = "$new_content"; then
            echo "Binary size badge is already current."
            exit 0
          fi

          encoded_content="$(base64 < dist/binary-size.json | tr -d '\n')"
          gh api \
            --method PUT \
            "$badge_api" \
            -f message="chore: update binary size badge for ${RELEASE_TAG}" \
            -f content="$encoded_content" \
            -f sha="$badge_sha" \
            -f branch="$BADGE_BRANCH" \
            >/dev/null

  publish-crate:
    name: Publish crate to crates.io
    needs: publish
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: publish-crate
          cache-targets: false

      - name: Verify release version
        id: crate
        run: |
          package_name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_TAG" = "v${package_version}"

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 \
            --user-agent "svarog-release-workflow (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${package_name}/${package_version}")"
          case "$status" in
            200)
              echo "${package_name} ${package_version} is already published."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Verify crate package
        if: ${{ steps.crate.outputs.published != 'true' }}
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        if: ${{ steps.crate.outputs.published != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: ${{ steps.crate.outputs.published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The package was verified before the short-lived token was issued.
        run: cargo publish --locked --no-verify
